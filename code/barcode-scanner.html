<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f14" />
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Barcode Scanner</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #131a22;
    --accent: #4fd1c5;
    --danger: #fc8181;
    --text: #e6edf3;
    --muted: #8b98a5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

  #app { display: flex; flex-direction: column; height: 100dvh; }

  header {
    padding: max(10px, env(safe-area-inset-top)) 16px 8px;
    text-align: center; font-weight: 600; letter-spacing: 0.5px;
    flex: 0 0 auto;
  }

  #viewport { position: relative; flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; container-type: size; }
  #video { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }

  #scanBox {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    /* Fit the box inside the viewport, not the window: use container-query units so
       it can never bleed through header/footer. Fallback to vw/vh for older browsers. */
    width: min(72vw, 46cqh); aspect-ratio: 1 / 1.5;
    max-width: calc(100% - 40px);
    max-height: calc(100% - 48px);
    border: 3px solid rgba(79, 209, 197, 0.9); border-radius: 14px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.35);
    pointer-events: none;
  }
  #scanLine {
    position: absolute; left: 8%; right: 8%; height: 2px; background: var(--accent);
    border-radius: 2px; box-shadow: 0 0 10px var(--accent);
    animation: sweep 2.2s ease-in-out infinite;
  }
  @keyframes sweep {
    0%, 100% { top: 8%; }
    50% { top: 90%; }
  }

  #flash { position: absolute; inset: 0; background: var(--accent); opacity: 0; pointer-events: none; transition: opacity 0.4s; }
  #flash.on { opacity: 0.35; transition: none; }

  footer { flex: 0 0 auto; background: var(--panel); padding: 12px 16px max(12px, env(safe-area-inset-bottom)); }

  #result { font-size: 17px; min-height: 24px; word-break: break-all; display: flex; align-items: center; gap: 10px; }
  #result .fmt { color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; flex: 0 0 auto; background: rgba(79,209,197,0.12); padding: 3px 8px; border-radius: 6px; }
  #result .val { flex: 1; cursor: pointer; word-break: break-all; }
  #result button { margin-left: auto; flex: 0 0 auto; background: none; border: 1px solid var(--muted); color: var(--muted); border-radius: 8px; padding: 5px 12px; font-size: 14px; }
  #result button:active { border-color: var(--accent); color: var(--accent); }

  #controls { display: flex; gap: 10px; margin-top: 10px; }
  #controls button {
    flex: 1; padding: 12px; font-size: 15px; border-radius: 10px; border: none;
    background: #1f2937; color: var(--text); font-weight: 600; cursor: pointer;
  }
  #controls button:active { filter: brightness(1.3); }
  #btnFlash.on { background: #3b3217; color: #f6e05e; }

  #status { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; color: #dfe9f0; font-size: 13px; text-shadow: 0 1px 3px #000; pointer-events: none; }

  #history {
    position: absolute; top: 8px; left: 8px; right: 8px; max-height: 45%; overflow-y: auto;
    background: rgba(11,15,20,0.92); border-radius: 12px; padding: 10px; display: none; z-index: 5;
  }
  #history.open { display: block; }
  #history h3 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: flex; justify-content: space-between; }
  #history h3 button { background: none; border: none; color: var(--muted); font-size: 13px; cursor: pointer; }
  .hitem { display: flex; align-items: center; gap: 8px; padding: 7px 4px; border-bottom: 1px solid #1f2937; font-size: 14px; }
  .hitem:last-child { border-bottom: none; }
  .hitem .t { color: var(--muted); font-size: 11px; flex: 0 0 auto; }
  .hitem span.val { word-break: break-all; flex: 1; cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <header>Barcode Scanner</header>

  <div id="viewport">
    <video id="video" playsinline muted></video>
    <div id="scanBox"><div id="scanLine"></div></div>
    <div id="flash"></div>
    <div id="history">
      <h3>Scanned <button id="btnClearHist">clear</button></h3>
      <div id="histList"></div>
    </div>
    <div id="status"></div>
  </div>

  <footer>
    <div id="result"><span id="resultText" style="color:var(--muted);flex:1">Point the camera at a barcode</span></div>
    <div id="controls">
      <button id="btnPause">⏸ Pause</button>
      <button id="btnFlash">🔦 Flash</button>
      <button id="btnHistory">📜 History (<span id="histCount">0</span>)</button>
    </div>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(() => {
  const video = document.getElementById('video');
  const statusEl = document.getElementById('status');
  const resultRow = document.getElementById('result');
  const btnPause = document.getElementById('btnPause');
  const btnFlash = document.getElementById('btnFlash');
  const btnHistory = document.getElementById('btnHistory');
  const history = document.getElementById('history');
  const histList = document.getElementById('histList');
  const histCount = document.getElementById('histCount');
  const flashEl = document.getElementById('flash');

  let paused = false;
  let stream = null;
  let reader = null;
  let lastText = null, lastAt = 0;
  const historyArr = [];

  const setStatus = (t) => { statusEl.textContent = t; };
  const now = () => Date.now();

  function pushResult(text, fmt) {
    if (text === lastText && now() - lastAt < 3000) return;
    lastText = text; lastAt = now();
    resultRow.innerHTML = '';
    const tag = document.createElement('span');
    tag.className = 'fmt'; tag.textContent = fmt;
    const val = document.createElement('span');
    val.className = 'val';
    val.textContent = text;
    val.title = 'tap to copy';
    val.onclick = () => copyText(text);
    const btn = document.createElement('button');
    btn.textContent = 'copy';
    btn.onclick = () => copyText(text);
    resultRow.append(tag, val, btn);

    historyArr.unshift({ text, fmt, at: new Date() });
    if (historyArr.length > 50) historyArr.pop();
    histCount.textContent = historyArr.length;
    renderHistory();

    flashEl.classList.add('on');
    setTimeout(() => flashEl.classList.remove('on'), 120);
    if (navigator.vibrate) navigator.vibrate(40);
  }

  async function copyText(t) {
    try {
      await navigator.clipboard.writeText(t);
      setStatus('Copied to clipboard ✓');
    } catch (_) {
      const ta = document.createElement('textarea');
      ta.value = t; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); setStatus('Copied to clipboard ✓'); }
      catch (e) { setStatus('Copy failed'); }
      document.body.removeChild(ta);
    }
    setTimeout(() => setStatus(paused ? 'Paused' : ''), 1200);
  }

  function renderHistory() {
    histList.innerHTML = '';
    for (const h of historyArr) {
      const row = document.createElement('div'); row.className = 'hitem';
      const t = document.createElement('span'); t.className = 't';
      t.textContent = h.at.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const v = document.createElement('span'); v.className = 'val';
      v.textContent = '[' + h.fmt + '] ' + h.text;
      v.onclick = () => copyText(h.text);
      row.append(t, v);
      histList.appendChild(row);
    }
  }

  btnHistory.onclick = () => history.classList.toggle('open');
  document.getElementById('btnClearHist').onclick = (e) => {
    e.stopPropagation();
    historyArr.length = 0; histCount.textContent = '0'; renderHistory();
  };

  btnPause.onclick = async () => {
    if (!reader) return;
    if (paused) {
      paused = false;
      await reader.decodeFromVideoDevice(null, video, onDecoded);
      btnPause.textContent = '⏸ Pause';
      setStatus('');
    } else {
      paused = true;
      reader.reset();
      btnPause.textContent = '▶ Resume';
      setStatus('Paused');
    }
  };

  btnFlash.onclick = async () => {
    try {
      if (!stream) return;
      const track = stream.getVideoTracks()[0];
      if (!track.getCapabilities || !track.getCapabilities().torch) { setStatus('No torch on this camera'); return; }
      await track.applyConstraints({ advanced: [{ torch: !track.getSettings().torch }] });
      const isOn = track.getSettings().torch;
      btnFlash.textContent = isOn ? '🔦 Flash On' : '🔦 Flash';
      btnFlash.classList.toggle('on', isOn);
    } catch (e) { setStatus('Torch error: ' + e.message); }
  };

  function onDecoded(result, err) {
    if (!result) return;
    pushResult(result.getText(), result.getBarcodeFormat());
  }

  async function start() {
    setStatus('Starting camera…');
    if (typeof ZXing === 'undefined') { setStatus('Scanner library failed to load — check your connection'); return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
    } catch (e) {
      setStatus('Camera error: ' + e.message);
      return;
    }
    video.srcObject = stream;
    await video.play();

    reader = new ZXing.BrowserCodeReader(['EAN_13', 'EAN_8', 'UPC_A', 'UPC_E', 'CODE_128', 'CODE_39', 'QR_CODE', 'DATA_MATRIX']);
    await reader.decodeFromVideoDevice(null, video, onDecoded);
  }

  start();
})();
</script>
</body>
</html>
