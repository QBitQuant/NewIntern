<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SECTOR 9 v3 - Tower Defense [3D]</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a0a; overflow:hidden; font-family:'Courier New',monospace; touch-action:none; user-select:none; }
#ui { position:absolute; top:10px; left:10px; color:#0f0; z-index:10; pointer-events:none; text-shadow:0 0 4px #0f0, 2px 2px 0 #003300; }
#ui div { margin-bottom:6px; font-size:15px; letter-spacing:1px; }
#controls { position:absolute; bottom:10px; left:10px; color:#8f8; z-index:10; pointer-events:none; font-size:11px; text-shadow:1px 1px 0 #002200; line-height:1.6; max-width:56vw; }
#msg { position:absolute; top:36%; left:50%; transform:translate(-50%,-50%); color:#f33; font-size:38px; font-weight:bold; z-index:20; text-shadow:0 0 10px #f00, 3px 3px 0 #300; display:none; text-align:center; line-height:1.5; }
.bigBtn { position:absolute; top:60%; left:50%; transform:translateX(-50%); z-index:20; background:#0a0; color:#0f0; border:3px solid #0f0; padding:14px 40px; font-family:'Courier New',monospace; font-size:20px; cursor:pointer; text-shadow:0 0 6px #0f0; box-shadow:0 0 12px rgba(0,255,0,.4), inset 0 0 8px rgba(0,255,0,.15); letter-spacing:3px; }
.bigBtn:hover { background:#0d0; }
#retryBtn { display:none; }

#shop { position:absolute; top:10px; right:10px; z-index:15; display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; max-width:46vw; }
.shopBtn { background:#041a0a; border:2px solid #0f0; color:#0f0; padding:8px 10px; font-family:'Courier New',monospace; font-size:12px; cursor:pointer; text-align:left; min-width:92px; line-height:1.5; }
.shopBtn small { display:block; color:#6c6; font-size:10px; }
.shopBtn.sel { background:#0a3315; box-shadow:0 0 10px rgba(0,255,0,.6); }
.shopBtn.cant { opacity:.4; }

#popup { position:absolute; z-index:16; display:none; background:rgba(2,18,8,.95); border:2px solid #0f0; color:#0f0; padding:10px; font-size:12px; min-width:175px; box-shadow:0 0 14px rgba(0,255,0,.35); }
#popup .row { display:flex; justify-content:space-between; margin-bottom:6px; gap:10px; }
#popup button { font-family:'Courier New',monospace; background:#0a2; color:#0f0; border:1px solid #0f0; padding:4px 8px; cursor:pointer; font-size:12px; flex:1; }
#popup button:hover { background:#0c3; }
#popup .lvl { letter-spacing:2px; margin-bottom:6px; text-shadow:0 0 5px #0f0; }

#waveBanner { position:absolute; top:20%; left:50%; transform:translateX(-50%); color:#ff3; font-size:30px; font-weight:bold; z-index:15; pointer-events:none; text-shadow:0 0 12px #f80, 2px 2px 0 #420; display:none; letter-spacing:3px; text-align:center; white-space:nowrap; }

#floaters { position:absolute; inset:0; pointer-events:none; z-index:12; overflow:hidden; }
.floater { position:absolute; color:#ff5; font-size:16px; font-weight:bold; text-shadow:1px 1px 0 #331, 0 0 6px #fa0; animation:floatUp 1s ease-out forwards; white-space:nowrap; }
@keyframes floatUp { to { transform:translateY(-46px); opacity:0; } }

#crt { position:absolute; inset:0; pointer-events:none; z-index:14;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.13) 0px, rgba(0,0,0,.13) 1px, transparent 2px, transparent 4px);
  mix-blend-mode:multiply; }
#crt::after { content:''; position:absolute; inset:0; box-shadow:inset 0 0 180px rgba(0,0,0,.75); }

#topBtns { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:15; display:flex; gap:8px; }
.topBtn { background:#041a0a; border:2px solid #0f0; color:#0f0; padding:6px 12px; font-family:'Courier New',monospace; cursor:pointer; font-size:12px; }
</style>
</head>
<body>
<div id="ui">
  <div>SECTOR 9 v3 :: TOWER DEFENSE</div>
  <div id="lives">LIVES: 20</div>
  <div id="score">SCORE: 0</div>
  <div id="money">$150</div>
  <div id="wave">WAVE: -</div>
  <div id="best" style="font-size:11px;color:#4a6;">BEST: 0</div>
  <div id="fps" style="font-size:10px;color:#4a6;">FPS: --</div>
</div>

<div id="shop">
  <div class="shopBtn sel" data-t="turret">TURRET $50<small>fast shot [1]</small></div>
  <div class="shopBtn" data-t="cannon">CANNON $90<small>slow heavy [2]</small></div>
  <div class="shopBtn" data-t="pulsar">PULSAR $140<small>area pulse [3]</small></div>
</div>
<div id="topBtns">
  <button class="topBtn" id="soundBtn">SOUND: ON</button>
  <button class="topBtn" id="pauseBtn">PAUSE</button>
  <button class="topBtn" id="speedBtn">SPEED: 1x</button>
</div>

<div id="controls">
  CLICK CELL: build &nbsp;|&nbsp; CLICK TOWER: upgrade/sell &nbsp;|&nbsp; SPACE: call wave &nbsp;|&nbsp; P: pause &nbsp;|&nbsp; F: fast-forward &nbsp;|&nbsp; boss every 5th wave
</div>

<div id="waveBanner"></div>
<div id="msg">SECTOR BREACHED<div style="font-size:16px;color:#faa;margin-top:12px" id="finalScore"></div></div>
<button class="bigBtn" id="startBtn">START MISSION</button>
<button class="bigBtn" id="retryBtn">RE-DEPLOY</button>
<div id="popup"></div>
<div id="floaters"></div>
<div id="crt"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ================= STATE =================
let scene, camera, renderer, clock;
let enemies=[], towers=[], projectiles=[], particles=[], gridCells=[], rings=[];
let lives=20, score=0, money=150, wave=0, gameOver=false, started=false, paused=false;
let spawnQueue=[], spawnTimer=0, waveActive=false, nextWaveTimer=0;
let mouse = new THREE.Vector2(), raycaster = new THREE.Raycaster();
const WAVE_DELAY=8;
let selectedType='turret', selectedTower=null;
let fpsFrames=0, fpsTime=0, gameSpeed=1, elapsed=0;
let bestScore=parseInt(localStorage.getItem('sector9_best')||'0');

// ================= AUDIO =================
let AC=null, soundOn=true;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function beep(f,dur,type='square',vol=.06,slide=0){
  if(!soundOn) return;
  try{
    const a=ac(), o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(f,a.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide), a.currentTime+dur);
    g.gain.setValueAtTime(vol,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur);
  }catch(e){}
}
const sfx={
  shoot:()=>beep(880,.07,'square',.03,-500),
  boom:()=>{beep(120,.25,'sawtooth',.08,-90); beep(60,.3,'triangle',.06);},
  coin:()=>{beep(990,.08,'square',.05,300); setTimeout(()=>beep(1320,.1,'square',.05,400),60);},
  build:()=>beep(440,.1,'triangle',.06,220),
  upgrade:()=>{beep(520,.08,'square',.05,260); setTimeout(()=>beep(780,.1,'square',.05,260),70);},
  sell:()=>beep(300,.15,'sawtooth',.05,-150),
  wave:()=>{beep(220,.15,'square',.06,110); setTimeout(()=>beep(330,.15,'square',.06,110),150);},
  lose:()=>beep(90,.4,'sawtooth',.07,-60),
  boss:()=>{[110,110,147,165].forEach((f,i)=>setTimeout(()=>beep(f,.22,'sawtooth',.08),i*160));},
  over:()=>{[220,180,140,90].forEach((f,i)=>setTimeout(()=>beep(f,.3,'square',.07),i*200));}
};

// ================= INIT =================
function init(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050510);
  scene.fog = new THREE.Fog(0x050510, 25, 70);
  camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);
  camera.position.set(0, 16, 18);
  camera.lookAt(0,0,0);
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);
  clock = new THREE.Clock();

  scene.add(new THREE.AmbientLight(0x334455, .8));
  const sun = new THREE.DirectionalLight(0xaaccff, .9);
  sun.position.set(8,15,6); sun.castShadow=true;
  sun.shadow.camera.left=-14; sun.shadow.camera.right=14;
  sun.shadow.camera.top=14; sun.shadow.camera.bottom=-14;
  scene.add(sun);
  const glow = new THREE.PointLight(0x00ff66, .5, 30);
  glow.position.set(0,6,-4); scene.add(glow);

  buildGrid();
  addEventListener('resize', onResize); onResize();
  addEventListener('mousemove', e=>{ mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1; });
  renderer.domElement.addEventListener('pointerdown', onDown);
  addEventListener('keydown', onKey);
  document.querySelectorAll('.shopBtn').forEach(b=>b.addEventListener('click',()=>pickType(b.dataset.t)));
  document.getElementById('soundBtn').onclick=()=>{ soundOn=!soundOn; document.getElementById('soundBtn').textContent='SOUND: '+(soundOn?'ON':'OFF'); };
  document.getElementById('pauseBtn').onclick=togglePause;
  document.getElementById('speedBtn').onclick=toggleSpeed;
  document.getElementById('retryBtn').onclick=resetGame;
  document.getElementById('startBtn').onclick=startGame;
  updateHUD();
  animate();
}
function onResize(){ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); }

// ================= GRID / PATH =================
const S=9;
const pathCells=[[0,4],[1,4],[2,4],[2,3],[2,2],[2,1],[3,1],[4,1],[5,1],[5,2],[5,3],[5,4],[5,5],[5,6],[4,6],[3,6],[2,6],[1,6],[0,6]];
const wp=[[-1.5,4],[0.5,4],[1.5,4],[2.5,4],[2.5,3.5],[2.5,2.5],[2.5,1.5],[3.5,1.5],[4.5,1.5],[5.5,1.5],[5.5,2.5],[5.5,3.5],[5.5,4.5],[5.5,5.5],[5.5,6.5],[4.5,6.5],[3.5,6.5],[2.5,6.5],[1.5,6.5],[0.5,6.5],[9.5,6.5]];
const pathSet=new Set(pathCells.map(c=>c.join(',')));

function buildGrid(){
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40), new THREE.MeshPhongMaterial({color:0x101820}));
  ground.rotation.x=-Math.PI/2; ground.position.y=-.5; ground.receiveShadow=true; scene.add(ground);
  const pathMat=new THREE.MeshPhongMaterial({color:0x2a3a4a});
  for(let i=0;i<wp.length-1;i++){
    const a=new THREE.Vector3(wp[i][0],0,wp[i][1]), b=new THREE.Vector3(wp[i+1][0],0,wp[i+1][1]);
    const len=a.distanceTo(b);
    const t=new THREE.Mesh(new THREE.BoxGeometry(1.6,.04,len), pathMat);
    t.position.copy(a).add(b).multiplyScalar(.5); t.position.y=-.48;
    t.rotation.y=Math.atan2(b.x-a.x,b.z-a.z); scene.add(t);
  }
  for(let x=0;x<S;x++)for(let z=0;z<S;z++){
    const isPath=pathSet.has(x+','+z);
    const mat=new THREE.MeshPhongMaterial({color:isPath?0x2a3a4a:0x14301c, transparent:true, opacity:isPath?1:.85});
    const m=new THREE.Mesh(new THREE.BoxGeometry(.92,.08,.92),mat);
    m.position.set(x-(S-1)/2+.5,0,z-(S-1)/2+.5);
    m.receiveShadow=true; m.userData={x,z,isPath};
    scene.add(m); gridCells.push(m);
    const edge=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(.94,.02,.94)),
      new THREE.LineBasicMaterial({color:isPath?0x3a5a7a:0x1f6e38, transparent:true, opacity:.6}));
    edge.position.copy(m.position); scene.add(edge);
  }
}

// ================= TOWERS =================
const TOWER_TYPES={
  turret:{cost:50, range:4.2, rate:1.6, dmg:12, color:0x33ffcc, h:.8, upCost:40},
  cannon:{cost:90, range:5.5, rate:.55, dmg:45, color:0xff9933, h:1.1, upCost:75},
  pulsar:{cost:140, range:3.4, rate:.8, dmg:20, color:0xcc66ff, h:.9, upCost:110, aoe:true}
};
function towerStats(t){
  const T=TOWER_TYPES[t.type], lv=t.level-1;
  return { range:T.range*(1+.2*lv), rate:T.rate*(1+.3*lv), dmg:Math.round(T.dmg*(1+.5*lv)) };
}
const canBuild=cell=>cell && !cell.userData.isPath && !cell.userData.tower;

function buildTower(cell,type){
  const T=TOWER_TYPES[type]; if(money<T.cost||!canBuild(cell)) return;
  money-=T.cost; cell.userData.tower=true;
  const g=new THREE.Group();
  const base=new THREE.Mesh(new THREE.CylinderGeometry(.32,.42,.3,8), new THREE.MeshPhongMaterial({color:0x445566}));
  base.position.y=.15; base.castShadow=true; g.add(base);
  const barrel=new THREE.Mesh(new THREE.BoxGeometry(.22,T.h,.22), new THREE.MeshPhongMaterial({color:T.color, emissive:T.color, emissiveIntensity:.35}));
  barrel.position.y=.3+T.h/2; barrel.castShadow=true; g.add(barrel);
  const tip=new THREE.Mesh(new THREE.SphereGeometry(.14,8,8), new THREE.MeshBasicMaterial({color:T.color}));
  tip.position.y=.3+T.h+.05; g.add(tip);
  if(type==='pulsar'){
    const ring=new THREE.Mesh(new THREE.TorusGeometry(.3,.05,6,16), new THREE.MeshBasicMaterial({color:T.color, transparent:true, opacity:.7}));
    ring.position.y=.9; ring.rotation.x=Math.PI/2; g.add(ring);
  }
  g.position.copy(cell.position); scene.add(g);
  towers.push({group:g, barrel, type, pos:cell.position.clone(), cd:0, target:null, level:1, invested:T.cost, cell});
  sfx.build();
  spawnParticles(g.position.clone().add(new THREE.Vector3(0,.5,0)), T.color, 8);
  updateHUD();
}

// ================= ENEMIES =================
function enemyBase(kind){
  return {
    grunt:{hp:60,speed:2.1,reward:15,color:0xcc2222,em:0x661111},
    speeder:{hp:30,speed:3.4,reward:12,color:0xff44aa,em:0xaa1155},
    tank:{hp:260,speed:1.3,reward:45,color:0x6688cc,em:0x223366},
    boss:{hp:1500,speed:.9,reward:200,color:0xffee44,em:0x887700}
  }[kind];
}
function spawnEnemy(kind){
  const b=enemyBase(kind);
  const hpScale=(1+(wave-1)*.45)*(kind==='boss'?1+ (wave/5-1)*.3:1);
  const e={ pos:new THREE.Vector3(wp[0][0],0,wp[0][1]), wpIndex:1, kind,
    hp:b.hp*hpScale, maxHp:b.hp*hpScale, speed:b.speed, reward:b.reward, dead:false };
  const g=new THREE.Group();
  const size=kind==='boss'?.85:kind==='tank'?.75:kind==='speeder'?.3:.5;
  let body;
  if(kind==='speeder') body=new THREE.Mesh(new THREE.ConeGeometry(size,size*2.3,6), new THREE.MeshPhongMaterial({color:b.color,emissive:b.em,emissiveIntensity:.4}));
  else if(kind==='boss') body=new THREE.Mesh(new THREE.OctahedronGeometry(size), new THREE.MeshPhongMaterial({color:b.color,emissive:b.em,emissiveIntensity:.5}));
  else body=new THREE.Mesh(new THREE.BoxGeometry(size,size,size), new THREE.MeshPhongMaterial({color:b.color,emissive:b.em,emissiveIntensity:.4}));
  body.position.y=.5; body.castShadow=true; g.add(body);
  const eye=new THREE.Mesh(new THREE.SphereGeometry(.12,6,6), new THREE.MeshBasicMaterial({color:0xffff88}));
  eye.position.set(0,.55,size*.5); g.add(eye);
  if(kind==='boss'){
    const aura=new THREE.Mesh(new THREE.TorusGeometry(size+.25,.06,6,20), new THREE.MeshBasicMaterial({color:0xffff44, transparent:true, opacity:.5}));
    aura.position.y=.5; aura.rotation.x=Math.PI/2; g.add(aura); e.aura=aura;
  }
  const bar=new THREE.Group();
  const bw=kind==='boss'?1.4:.7;
  const bg=new THREE.Mesh(new THREE.PlaneGeometry(bw,.1), new THREE.MeshBasicMaterial({color:0x330000}));
  const fg=new THREE.Mesh(new THREE.PlaneGeometry(bw,.1), new THREE.MeshBasicMaterial({color:kind==='boss'?0xffee44:0x00ff44}));
  fg.position.z=.001; bar.add(bg); bar.add(fg); bar.position.y=1.3; g.add(bar);
  e.group=g; e.fgMesh=fg; e.barGroup=bar;
  scene.add(g); enemies.push(e);
  if(kind==='boss'){ sfx.boss(); banner('!! BOSS INCOMING !!'); }
}

function damageEnemy(e,d){
  if(e.dead) return;
  e.hp-=d;
  if(e.hp<=0){
    e.dead=true; scene.remove(e.group);
    const sp=toScreen(e.pos.clone().add(new THREE.Vector3(0,.5,0)));
    money+=e.reward; score+=Math.round(e.reward*10*(1+wave*.05));
    floatText('+$'+e.reward, sp.x, sp.y, '#7f7');
    spawnParticles(e.pos.clone(), 0xffcc33, e.kind==='boss'?40:e.kind==='tank'?22:12);
    sfx.coin(); updateHUD();
  } else {
    const f=e.hp/e.maxHp;
    e.fgMesh.scale.x=Math.max(.01,f);
    e.fgMesh.position.x=-(1-f)*(e.kind==='boss'?.7:.35);
  }
}
function toScreen(v){ const p=v.clone().project(camera); return {x:(p.x+1)/2*innerWidth, y:(1-p.y)/2*innerHeight}; }

// ================= PROJECTILES / RINGS / PARTICLES =================
function fireProjectile(t,target){
  const T=TOWER_TYPES[t.type], s=towerStats(t);
  const p=new THREE.Mesh(new THREE.SphereGeometry(.12,8,8), new THREE.MeshBasicMaterial({color:T.color}));
  p.position.copy(t.group.position).add(new THREE.Vector3(0,T.h+.35,0));
  scene.add(p);
  projectiles.push({mesh:p, target, speed:16, dmg:s.dmg});
  spawnParticles(p.position, T.color, 2);
  sfx.shoot();
}
function spawnRing(pos,max,color){
  const m=new THREE.Mesh(new THREE.RingGeometry(.92,1,24), new THREE.MeshBasicMaterial({color, transparent:true, side:THREE.DoubleSide}));
  m.rotation.x=-Math.PI/2; m.position.copy(pos).add(new THREE.Vector3(0,.25,0));
  scene.add(m);
  rings.push({mesh:m, r:1, max, life:1});
}
function spawnParticles(pos,color,n){
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,.08), new THREE.MeshBasicMaterial({color, transparent:true}));
    m.position.copy(pos).add(new THREE.Vector3(0,.4,0)); scene.add(m);
    particles.push({mesh:m, vel:new THREE.Vector3((Math.random()-.5)*4,Math.random()*4,(Math.random()-.5)*4), life:.6+Math.random()*.4});
  }
}

// ================= WAVES =================
function startWave(){
  wave++; waveActive=true; nextWaveTimer=0; spawnQueue=[];
  const n=4+wave*2, isBossWave=wave%5===0;
  for(let i=0;i<n;i++){
    let kind='grunt';
    if(isBossWave && i===n-1) kind='boss';
    else if(wave>=3 && i%5===4) kind='tank';
    else if(wave>2 && Math.random()<.3) kind='speeder';
    spawnQueue.push(kind);
  }
  spawnTimer=.3;
  banner('WAVE '+wave+(isBossWave?' — BOSS WAVE':''));
  sfx.wave(); updateHUD();
}

// ================= UI HELPERS =================
function banner(txt){
  const b=document.getElementById('waveBanner');
  b.textContent=txt; b.style.display='block';
  clearTimeout(b._t); b._t=setTimeout(()=>b.style.display='none',2200);
}
function floatText(txt,x,y,color){
  const el=document.createElement('div');
  el.className='floater'; el.textContent=txt;
  el.style.left=(x-24)+'px'; el.style.top=(y-10)+'px';
  if(color) el.style.color=color;
  document.getElementById('floaters').appendChild(el);
  setTimeout(()=>el.remove(),1000);
}

// ================= UPDATE =================
function update(dt){
  if(gameOver||!started||paused) return;

  if(!waveActive){
    nextWaveTimer-=dt;
    if(nextWaveTimer<=0) startWave();
  } else {
    // spawn from queue with pacing
    spawnTimer-=dt;
    if(spawnQueue.length && spawnTimer<=0){
      spawnEnemy(spawnQueue.shift());
      spawnTimer=Math.max(.4, 1.2-wave*.03);
    }
    if(!spawnQueue.length && enemies.length===0){
      waveActive=false; nextWaveTimer=WAVE_DELAY;
      const bonus=25+wave*5; money+=bonus;
      banner('SECTOR CLEAR +$'+bonus); updateHUD();
    }
  }

  // enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i]; if(e.dead) continue;
    const tgt=new THREE.Vector3(wp[e.wpIndex][0],0,wp[e.wpIndex][1]);
    const dir=tgt.clone().sub(e.pos); const dist=dir.length();
    if(dist<.15){
      e.wpIndex++;
      if(e.wpIndex>=wp.length){ e.dead=true; scene.remove(e.group); loseLife(); continue; }
    } else e.pos.add(dir.normalize().multiplyScalar(e.speed*dt));
    e.group.position.copy(e.pos);
    e.group.rotation.y+=dt*3;
    e.barGroup.quaternion.copy(camera.quaternion);
    if(e.aura){ e.aura.rotation.z+=dt*2; e.aura.material.opacity=.35+Math.sin(elapsed*4)*.2; }
  }

  // towers
  for(const t of towers){
    t.cd-=dt;
    const s=towerStats(t);
    if(!t.target||t.target.dead)
      t.target=enemies.find(e=>!e.dead && t.pos.distanceTo(e.pos)<=s.range)||null;
    if(t.target){
      const look=t.target.group.position.clone().add(new THREE.Vector3(0,.4,0));
      t.group.lookAt(look); t.group.rotateX(Math.PI/2);
      if(t.cd<=0){
        if(TOWER_TYPES[t.type].aoe){ spawnRing(t.pos.clone(), s.range, TOWER_TYPES[t.type].color); damageNearby(t.pos, s.range, s.dmg); }
        else fireProjectile(t,t.target);
        t.cd=1/s.rate;
      }
    }
  }

  // projectiles
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    if(p.target.dead){ scene.remove(p.mesh); projectiles.splice(i,1); continue; }
    const tgt=p.target.group.position.clone().add(new THREE.Vector3(0,.45,0));
    const dir=tgt.sub(p.mesh.position); const d=dir.length();
    if(d<.4){ damageEnemy(p.target,p.dmg); scene.remove(p.mesh); projectiles.splice(i,1); continue; }
    p.mesh.position.add(dir.normalize().multiplyScalar(p.speed*dt));
  }

  // rings
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];
    r.r+=dt*9; r.life-=dt*2.2;
    if(r.life<=0||r.r>=r.max){ scene.remove(r.mesh); rings.splice(i,1); continue; }
    r.mesh.scale.setScalar(r.r); r.mesh.material.opacity=r.life*.6;
  }

  // particles
  for(let i=particles.length-1;i>=0;i--){
    const pt=particles[i]; pt.life-=dt;
    if(pt.life<=0){ scene.remove(pt.mesh); particles.splice(i,1); continue; }
    pt.vel.y-=9*dt; pt.mesh.position.addScaledVector(pt.vel,dt);
    pt.mesh.material.opacity=Math.min(1,pt.life*2);
  }

  updateHover();
}
function damageNearby(pos,range,dmg){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i]; if(e.dead) continue;
    if(pos.distanceTo(e.pos)<=range) damageEnemy(e,dmg);
  }
}

function loseLife(){
  lives--; sfx.lose();
  const sp=toScreen(new THREE.Vector3(wp[wp.length-1][0],.5,wp[wp.length-1][1]));
  floatText('-1 LIFE', sp.x, sp.y, '#f55');
  spawnParticles(new THREE.Vector3(wp[wp.length-1][0],.5,wp[wp.length-1][1]),0xff3333,15);
  updateHUD();
  if(lives<=0) endGame();
}
function endGame(){
  gameOver=true; sfx.over();
  if(score>bestScore){ bestScore=score; localStorage.setItem('sector9_best',bestScore); }
  document.getElementById('msg').style.display='block';
  document.getElementById('finalScore').innerHTML=
    'FINAL SCORE: '+score+' — WAVE '+wave+
    (score>=bestScore&&bestScore>0?'<br><span style="color:#ff5">★ NEW RECORD ★</span>':'');
  document.getElementById('retryBtn').style.display='block';
  updateHUD();
}

// ================= INPUT =================
function pickCell(){
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(gridCells);
  return hits.length?hits[0].object:null;
}
let hoverCell=null;
function updateHover(){
  if(!started||gameOver) return;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(gridCells);
  gridCells.forEach(c=>{ if(c.userData.hl){ c.material.opacity=c.userData.isPath?1:.85; c.material.color.setHex(c.userData.isPath?0x2a3a4a:0x14301c); c.userData.hl=false; } });
  if(hits.length){
    const c=hits[0].object; hoverCell=c;
    if(canBuild(c)){ c.userData.hl=true; c.material.color.setHex(0x66ff88); c.material.opacity=1; }
  } else hoverCell=null;
}
function onDown(e){
  if(!started||gameOver) return;
  mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const tHits=raycaster.intersectObjects(towers.map(t=>t.group),true);
  if(tHits.length){
    let o=tHits[0].object;
    while(o.parent && !towers.find(t=>t.group===o)) o=o.parent;
    const tw=towers.find(t=>t.group===o);
    if(tw){ selectTower(tw); return; }
  }
  const c=pickCell(); hidePopup();
  if(!c||!canBuild(c)) return;
  buildTower(c,selectedType);
}
function onKey(e){
  if(e.code==='Space'){ e.preventDefault(); if(started&&!gameOver&&!paused&&!waveActive&&nextWaveTimer>1) nextWaveTimer=.5; }
  if(e.key==='1') pickType('turret');
  if(e.key==='2') pickType('cannon');
  if(e.key==='3') pickType('pulsar');
  if(e.key==='p'||e.key==='P') togglePause();
  if(e.key==='f'||e.key==='F') toggleSpeed();
}
function pickType(t){
  selectedType=t;
  document.querySelectorAll('.shopBtn').forEach(b=>b.classList.toggle('sel',b.dataset.t===t));
}
function togglePause(){
  if(!started||gameOver) return;
  paused=!paused;
  document.getElementById('pauseBtn').textContent=paused?'RESUME':'PAUSE';
  banner(paused?'— PAUSED —':'');
}
function toggleSpeed(){
  gameSpeed=gameSpeed===1?2:gameSpeed===2?4:1;
  document.getElementById('speedBtn').textContent='SPEED: '+gameSpeed+'x';
}

// ================= TOWER POPUP =================
const popup=document.getElementById('popup');
function selectTower(t){ selectedTower=t; renderPopup(); }
function hidePopup(){ selectedTower=null; popup.style.display='none'; }
function renderPopup(){
  const t=selectedTower; if(!t) return;
  const s=towerStats(t), T=TOWER_TYPES[t.type];
  const maxLvl=t.level>=4;
  const upCost=Math.round(T.upCost*Math.pow(1.6,t.level-1));
  const sellVal=Math.round(t.invested*.6);
  popup.innerHTML=`<div class="lvl">${t.type.toUpperCase()} LV${t.level}${maxLvl?' MAX':''}</div>
    <div class="row"><span>DMG</span><b>${s.dmg}</b></div>
    <div class="row"><span>RANGE</span><b>${s.range.toFixed(1)}</b></div>
    <div class="row"><span>ROF</span><b>${s.rate.toFixed(2)}/s</b></div>
    <div style="margin-top:8px;display:flex;gap:6px">
      ${maxLvl?'':`<button id="upBtn">UP $${upCost}</button>`}
      <button id="sellBtn">SELL $${sellVal}</button>
    </div>`;
  popup.style.display='block';
  const sp=toScreen(t.pos.clone().add(new THREE.Vector3(0,1.4,0)));
  let px=Math.min(sp.x+18, innerWidth-200), py=Math.max(10, sp.y-60);
  popup.style.left=px+'px'; popup.style.top=py+'px';
  const upBtn=document.getElementById('upBtn');
  if(upBtn) upBtn.onclick=()=>{
    if(money>=upCost&&t.level<4){
      money-=upCost; t.invested+=upCost; t.level++;
      t.barrel.scale.y=1+.12*(t.level-1);
      sfx.upgrade();
      spawnParticles(t.pos.clone().add(new THREE.Vector3(0,1,0)),0xffff66,10);
      renderPopup(); updateHUD();
    } else floatText('NEED $'+upCost, sp.x, sp.y, '#f55');
  };
  document.getElementById('sellBtn').onclick=()=>{
    money+=sellVal; scene.remove(t.group); towers.splice(towers.indexOf(t),1);
    sfx.sell(); floatText('+$'+sellVal, sp.x, sp.y, '#7f7');
    hidePopup(); updateHUD();
  };
}

// ================= HUD =================
function updateHUD(){
  document.getElementById('lives').textContent='LIVES: '+Math.max(0,lives);
  document.getElementById('score').textContent='SCORE: '+score;
  document.getElementById('money').textContent='$'+money;
  document.getElementById('wave').textContent=
    waveActive?('WAVE: '+wave):
    (started&&nextWaveTimer>0)?('NEXT WAVE IN '+Math.ceil(nextWaveTimer)+'s'):
    ('WAVE: '+(wave||'-'));
  document.getElementById('best').textContent='BEST: '+bestScore;
  document.querySelectorAll('.shopBtn').forEach(b=>b.classList.toggle('cant', money<TOWER_TYPES[b.dataset.t].cost));
}

// ================= ANIMATE =================
function animate(){
  requestAnimationFrame(animate);
  let dt=Math.min(clock.getDelta(),.05)*gameSpeed;
  if(paused||gameOver) dt=0;
  elapsed+=dt;
  update(dt);

  fpsFrames++; fpsTime+=1/gameSpeed||dt;
  const realDt=Math.min(clock.getDelta()||.016,.05); // rough fps display
  if(fpsTime>=1){ document.getElementById('fps').textContent='FPS: ~'+Math.round(fpsFrames/Math.max(fpsTime,realDt)); fpsFrames=0; fpsTime=0; }

  if(started&&!gameOver&&!paused){
    camera.position.x=Math.sin(elapsed*.3)*.6;
    camera.lookAt(0,0,0);
    if(selectedTower) renderPopup();
  }
  renderer.render(scene,camera);
}

// ================= START / RESET =================
function startGame(){
  started=true; nextWaveTimer=3;
  document.getElementById('startBtn').style.display='none';
  sfx.wave(); updateHUD();
}
function resetGame(){
  enemies.forEach(e=>scene.remove(e.group));
  projectiles.forEach(p=>scene.remove(p.mesh));
  particles.forEach(p=>scene.remove(p.mesh));
  rings.forEach(r=>scene.remove(r.mesh));
  towers.forEach(t=>scene.remove(t.group));
  enemies=[];projectiles=[];particles=[];rings=[];towers=[];
  gridCells.forEach(c=>{ c.userData.tower=false; c.material.color.setHex(c.userData.isPath?0x2a3a4a:0x14301c); c.material.opacity=c.userData.isPath?1:.85; });
  lives=20;score=0;money=150;wave=0;gameOver=false;paused=false;
  spawnQueue=[];waveActive=false;nextWaveTimer=3;gameSpeed=1;
  document.getElementById('speedBtn').textContent='SPEED: 1x';
  document.getElementById('pauseBtn').textContent='PAUSE';
  hidePopup();
  document.getElementById('msg').style.display='none';
  document.getElementById('retryBtn').style.display='none';
  banner('RE-DEPLOYED'); updateHUD();
}

init();
</script>
